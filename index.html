<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FF7A59">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>小小英語冒險島｜台北市國小英語練習</title>
<style>
:root{
  --bg:#FFF8EC; --ink:#2B2340; --muted:#7A7091; --card:#FFFFFF;
  --g1:#FF7A59; --g2:#FFB23F; --g3:#3CC79A; --g4:#2FA9E0; --g5:#7B6CF6; --g6:#E85BB3;
  --ok:#2EBD6B; --bad:#F2545B; --line:#EFE6D6; --accent:var(--g1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;min-height:100vh}
.en{font-family:"Arial Rounded MT Bold","Avenir Next",system-ui,"PingFang TC",sans-serif}
header{position:sticky;top:0;padding-top:max(10px,env(safe-area-inset-top))!important;z-index:5;background:var(--bg);border-bottom:2px dashed var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px}
header h1{font-size:20px;margin:0;font-weight:900;flex:1;cursor:pointer}
header h1 span{color:var(--accent)}
.starbox{background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700}
main{max-width:860px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
body{-webkit-user-select:none;user-select:none;overscroll-behavior:none}
.grades{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:6px 0 18px}
.gbtn{border:0;border-radius:16px;padding:10px 4px;font-weight:900;font-size:16px;color:#fff;cursor:pointer;opacity:.45;transition:.15s;font-family:inherit}
.gbtn.on{opacity:1;transform:translateY(-3px);box-shadow:0 5px 0 rgba(0,0,0,.15)}
.gbtn small{display:block;font-weight:500;font-size:11px}
.hero{background:var(--accent);color:#fff;border-radius:24px;padding:18px 20px;margin-bottom:18px;position:relative;overflow:hidden}
.hero h2{margin:0 0 4px;font-size:24px;font-weight:900}
.hero p{margin:0;opacity:.95;font-size:14px}
.hero .big{position:absolute;right:14px;top:6px;font-size:64px;opacity:.9}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.ch{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;cursor:pointer;transition:.15s;text-align:left;font-family:inherit;color:inherit}
.ch:hover{transform:translateY(-3px);border-color:var(--accent)}
.ch .ico{font-size:34px}
.ch b{display:block;font-size:17px;margin:6px 0 2px}
.ch span{font-size:13px;color:var(--muted)}
.ch .stars{margin-top:6px;font-size:14px;letter-spacing:2px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:20px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{border:0;background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink)}
.topbar h3{margin:0;font-size:19px;flex:1}
.prog{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--accent);transition:.3s}
.q{font-size:24px;font-weight:700;text-align:center;margin:10px 0 18px;line-height:1.5}
.q .blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--accent);color:var(--accent)}
.qsub{text-align:center;color:var(--muted);font-size:14px;margin-top:-10px;margin-bottom:12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px;font-size:20px;font-weight:700;cursor:pointer;font-family:"Arial Rounded MT Bold","Avenir Next",system-ui,"PingFang TC",sans-serif;color:var(--ink);transition:.12s}
.opt:hover{border-color:var(--accent)}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.tip{margin-top:14px;padding:12px 14px;border-radius:14px;background:#FFF3D6;font-size:15px;display:none}
.tip.show{display:block}
.btn{border:0;background:var(--accent);color:#fff;font-weight:900;font-size:17px;border-radius:16px;padding:12px 22px;cursor:pointer;font-family:inherit;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.speak{border:0;background:#fff;border:2px solid var(--line);border-radius:50%;width:46px;height:46px;font-size:20px;cursor:pointer}
/* flashcard */
.flash{text-align:center;padding:20px 10px}
.flash .emo{font-size:90px;line-height:1.1}
.flash .w{font-size:46px;font-weight:800;margin:6px 0}
.flash .z{font-size:22px;color:var(--muted)}
.wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:16px}
.wl{border:2px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;background:#fff;text-align:left;font-family:inherit;color:inherit}
.wl b{font-family:"Arial Rounded MT Bold","Avenir Next",system-ui;font-size:17px}
.wl small{display:block;color:var(--muted)}
/* spelling */
.slots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:10px 0 18px}
.slot{width:44px;height:54px;border-radius:12px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;font-family:"Arial Rounded MT Bold","Avenir Next",system-ui;background:#fff}
.slot.hole{border-color:var(--accent);border-style:dashed;color:var(--accent)}
.slot.cur{box-shadow:0 0 0 4px rgba(0,0,0,.08);background:#FFF3D6}
.slot.sp{border:0;width:16px;background:none}
.tiles{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.tile{width:52px;height:52px;border-radius:14px;border:0;background:var(--accent);color:#fff;font-size:26px;font-weight:800;font-family:"Arial Rounded MT Bold","Avenir Next",system-ui;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.tile.used{visibility:hidden}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.15)}}
/* translate */
.zh{font-size:26px;font-weight:900;text-align:center;margin:8px 0 16px}
.ansline{min-height:64px;border:2px dashed var(--accent);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-bottom:14px}
.wt{border:0;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-size:20px;font-weight:700;font-family:"Arial Rounded MT Bold","Avenir Next",system-ui;cursor:pointer;color:var(--ink)}
.ansline .wt{background:#FFF3D6;border-color:var(--accent)}
/* match */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mc{aspect-ratio:1/1.05;border-radius:16px;border:0;cursor:pointer;font-family:"Arial Rounded MT Bold","Avenir Next",system-ui,"PingFang TC";font-weight:800;font-size:18px;background:var(--accent);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15);padding:6px;line-height:1.2}
.mc.open{background:#fff;color:var(--ink);border:2px solid var(--accent)}
.mc.done{background:var(--ok);color:#fff;opacity:.55;cursor:default}
.mc .e{font-size:28px;display:block}
.stat{display:flex;gap:16px;justify-content:center;color:var(--muted);font-weight:700;margin-bottom:12px}
/* result */
.result{text-align:center;padding:20px}
.result .s{font-size:54px;letter-spacing:6px}
.result h2{font-size:30px;margin:8px 0}
.review{text-align:left;margin-top:16px;font-size:15px}
.review div{padding:8px 10px;border-radius:10px;background:#FFF0F0;margin-bottom:6px}
/* info */
.info h4{margin:18px 0 6px;font-size:17px}
.info p,.info li{font-size:15px;line-height:1.7}
.info table{border-collapse:collapse;width:100%;font-size:14px}
.info td,.info th{border:1px solid var(--line);padding:6px 8px;text-align:left}
.info th{background:#FFF3D6}
.info a{color:var(--g4)}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
@media (max-width:560px){
  .grades{grid-template-columns:repeat(3,1fr)}
  .q{font-size:20px}.opt{font-size:18px;padding:12px}
  .mgrid{grid-template-columns:repeat(3,1fr)}
  .flash .w{font-size:38px}
  .slot{width:36px;height:46px;font-size:24px}
}
.badge{display:inline-block;background:#FFE1A8;color:#8A5A00;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;margin-left:8px;vertical-align:middle}
.papers{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:14px}
.remedy-box{background:#EAF6FF;border-radius:16px;padding:14px;margin-top:14px;line-height:1.7;font-size:15px}
.slot.reveal{background:#FFE3E3;border-color:var(--bad);color:var(--bad)}
.tile.wrongtile{background:var(--bad)}
.tile:disabled{opacity:.6;cursor:default}
.retry{background:#FFF0D9;color:#8A5A00;border-radius:12px;padding:8px 12px;font-weight:700;text-align:center;margin-bottom:10px}
.opt.en{font-family:"Arial Rounded MT Bold","Avenir Next",system-ui,"PingFang TC",sans-serif}
.installbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;background:#2B2340;color:#fff;border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.installbar b{flex:1;font-size:15px;line-height:1.4}
.installbar .btn{padding:10px 16px;font-size:16px;white-space:nowrap}
.installbar .x{background:none;border:0;color:#bbb;font-size:22px;cursor:pointer;padding:0 4px}
.imodal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.imodal .box{background:#fff;border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:520px}
.imodal h3{margin:0 0 12px;font-size:21px}
.imodal ol{margin:0 0 16px;padding-left:22px;font-size:18px;line-height:1.9}
.imodal .note{background:#FFF3D6;border-radius:12px;padding:10px 12px;font-size:15px;margin-bottom:14px}
.arrowdown{text-align:center;font-size:40px;animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(8px)}}
.daily{background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px 16px;margin-bottom:16px}
.dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:15px;flex-wrap:wrap;gap:4px}
.dhead span{color:var(--muted);font-weight:700}
.drow{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:15px}
.drow .dt{width:118px;flex-shrink:0}.drow.ok .dt{color:var(--muted);text-decoration:line-through}
.dbar{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}.dbar i{display:block;height:100%;background:var(--ok)}
.dn{width:44px;text-align:right;color:var(--muted);font-weight:700;font-size:13px}
.dok{margin-top:6px;background:#E7F8EE;border-radius:10px;padding:6px 10px;font-size:14px;font-weight:700;color:#1E8A4C}
.srsrow{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-bottom:1px dashed var(--line);font-size:15px}
.srsmeta{color:var(--muted);font-size:13px;white-space:nowrap}
.mcard.locked{opacity:.45;cursor:not-allowed}
.arena{position:relative;text-align:center;background:linear-gradient(180deg,#EEF4FF,#fff);border-radius:20px;padding:12px 10px 10px;margin-bottom:10px}
.arena.hurt{animation:hurt .45s}@keyframes hurt{0%,100%{background:#EEF4FF}40%{background:#FFD6D6;transform:translateX(-6px)}70%{transform:translateX(6px)}}
.mon{font-size:76px;line-height:1.1;display:inline-block;animation:idle 1.6s infinite ease-in-out}
@keyframes idle{50%{transform:translateY(-6px)}}
.mon.hit{animation:hit .4s}@keyframes hit{0%{transform:scale(1)}30%{transform:scale(.8) rotate(-10deg);filter:brightness(2)}100%{transform:scale(1)}}
.mon.dead{animation:dead .9s forwards}@keyframes dead{to{transform:scale(0) rotate(360deg);opacity:0}}
.mname{font-weight:900;font-size:17px;margin:2px 0 6px}
.hpbar{position:relative;height:18px;background:#FFE0E0;border-radius:99px;overflow:hidden;margin:0 auto;max-width:360px}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#F2545B,#FF8A5B);transition:width .35s}
.hpbar span{position:absolute;inset:0;font-size:12px;font-weight:700;line-height:18px;color:#5a1a1a}
.arow{display:flex;justify-content:space-between;max-width:360px;margin:8px auto 0;font-size:18px;min-height:24px}
.combo{color:#E8590C;font-weight:900;font-size:16px}
.dmg{position:absolute;left:0;right:0;top:34%;font-size:26px;font-weight:900;color:#2F6FE0;opacity:0;pointer-events:none}
.dmg.show{animation:dmg .8s}.dmg.crit{color:#E8590C;font-size:32px}.dmg.bad{color:var(--bad)}
@keyframes dmg{0%{opacity:0;transform:translateY(10px)}20%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
</style>
</head>
<body>
<header>
  <h1 onclick="go('home')">🏝️ 小小英語<span>冒險島</span></h1>
  <div class="starbox">🔥 <span id="streakN">0</span></div><div class="starbox">⭐ <span id="totalStars">0</span></div>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* ===================== 隨機工具（可設定種子，讓模擬考每回題目固定） ===================== */
let R=Math.random;
function seeded(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const one=a=>a[R()*a.length|0];
const $=s=>document.querySelector(s);
const app=$('#app');

/* ===================== 單字資料：依「臺北市國民小學英語聽說評量手冊」應用字詞分年 ===================== */
const COLORS_G=['','#FF7A59','#FFB23F','#3CC79A','#2FA9E0','#7B6CF6','#E85BB3'];
const BAND=['','低年段','低年段','中年段','中年段','高年段','高年段'];
const RAW={
1:"girl|女孩|👧;boy|男孩|👦;teacher|老師|👩‍🏫;friend|朋友|🤝;mom|媽媽|👩;dad|爸爸|👨;sister|姊妹|👧;brother|兄弟|👦;apple|蘋果|🍎;banana|香蕉|🍌;egg|蛋|🥚;milk|牛奶|🥛;cake|蛋糕|🍰;cat|貓|🐱;dog|狗|🐶;fish|魚|🐟;one|一|1️⃣;two|二|2️⃣;three|三|3️⃣;four|四|4️⃣;five|五|5️⃣;hat|帽子|👒;happy|快樂的|😊;good|好的|👍;book|書|📕;yes|是|⭕;no|不|❌",
2:"ball|球|⚽;box|盒子|📦;bag|袋子；書包|🎒;class|班級|🏫;cow|母牛|🐄;pig|豬|🐷;bird|鳥|🐦;home|家|🏠;school|學校|🏫;zoo|動物園|🦒;name|名字|📛;look|看|👀;go|去|🚶;English|英語|🔤;Taiwan|台灣|🇹🇼;Taipei|台北|🏙️;mother|母親|👩;father|父親|👨;who|誰|❓;what|什麼|❓;this|這個|👉;that|那個|👈",

function misspell(w){const out=new Set(),L2=w.length;for(let n=0;n<40&&out.size<2;n++){const k=1+(R()*(L2-2)|0),r=R();let v;
 if(r<.33)v=w.slice(0,k)+w[k+1]+w[k]+w.slice(k+2);else if(r<.66)v=w.slice(0,k)+w.slice(k+1);else v=w.slice(0,k)+w[k]+w.slice(k);
 if(v&&v!==w)out.add(v)}return[...out]}
const spellable=w=>/^[A-Za-z ]+$/.test(w.e)&&w.e.replace(/ /g,'').length>=3;
function wordFmts(w,withSpell){const f=['enzh','zhen','listen'];if(/^[A-Za-z]{4,}$/.test(w.e))f.push('spellc');if(withSpell&&spellable(w))f.push('spell');return f}
function wordItem(w,f){
 const all=wordsUpTo(state.grade),dz=()=>pick(all.filter(x=>x.z!==w.z),6).map(x=>x.z),de=()=>pick(all.filter(x=>x.e!==w.e),6).map(x=>x.e);
 const base={fam:{k:'word',w},review:`${w.m} ${w.e}＝${w.z}`};
 const mk=(o,ans,wr)=>{const op=[ans];for(const x of wr){if(op.length>=3)break;if(!op.includes(x))op.push(x)}return Object.assign({type:'mc',ans,opts:shuffle(op)},o,base)};
 if(f=='spell')return Object.assign({type:'spell',w},base);
 if(f=='enzh')return mk({pre:w.m+' ',q:w.e,sub:'這個單字是什麼意思？',sayFirst:w.e,sayAfter:w.e},w.z,dz());
 if(f=='zhen')return mk({pre:w.m+' ',q:w.z,sub:'英文怎麼說？',sayAfter:w.e},w.e,de());
 if(f=='listen')return mk({q:'🎧 聽一聽，是哪個單字？',sub:'按「再聽一次」可以重聽',listen:w.e},w.e,de());
 const ms=misspell(w.e);if(ms.length<2)return wordItem(w,'zhen');
 return mk({pre:w.m+' ',q:w.z,sub:'哪一個拼字是正確的？',sayAfter:w.e},w.e,ms);
}
function ruleItem(id){const it=GEN[id]();it.fam={k:'rule',id};it.review=fill(it.q,it.ans);return it}
function tplItem(t){const[zh,en]=t[1]();return{type:'arrange',zh,en,fam:{k:'tpl',t},review:`${zh} → ${en}`}}
function distinct(make,n,key,tries){const out=[],seen=new Set();for(let k=0;k<(tries||n*12)&&out.length<n;k++){const it=make();const s=key(it);if(!seen.has(s)){seen.add(s);out.push(it)}}return out}
/* 錯一題 → 產生 3 題類似題 */
function makeLike(fam,n){
 if(fam.k=='word'){const f=shuffle(wordFmts(fam.w,true));const out=[];for(let k=0;k<n;k++)out.push(wordItem(fam.w,f[k%f.length]));return out}
 if(fam.k=='rule'){const out=distinct(()=>ruleItem(fam.id),n,x=>x.q);while(out.length<n)out.push(ruleItem(fam.id));return out}
 let out=distinct(()=>tplItem(fam.t),n,x=>x.zh);
 const same=TPL.filter(t=>t[0]==fam.t[0]&&t!==fam.t);while(out.length<n)out.push(tplItem(one(same.length?same:TPL)));return out;
}

/* ===================== 模擬考：學習內容 × 3 ===================== */
const EXAM={};
function examInfo(g){
 if(EXAM[g])return EXAM[g];
 const old=R,oldG=state.grade;R=seeded(g*9973+7);state.grade=g;
 try{
  const words=WORDS[g],rules=rulesFor('all',g),tpls=TPL.filter(t=>t[0]==g);let items=[];
  words.forEach(w=>{shuffle(wordFmts(w,false)).slice(0,3).forEach(f=>items.push(wordItem(w,f)))});
  rules.forEach(r=>{items=items.concat(makeLike({k:'rule',id:r[0]},3))});
  tpls.forEach(t=>{items=items.concat(makeLike({k:'tpl',t},3))});
  items=shuffle(items);const papers=[];for(let k=0;k<items.length;k+=20)papers.push(items.slice(k,k+20));
  if(papers.length>1&&papers[papers.length-1].length<8){const last=papers.pop();papers[papers.length-1]=papers[papers.length-1].concat(last)}
  return EXAM[g]={total:items.length,papers,rules,tpls,words:words.length};
 }finally{R=old;state.grade=oldG}
}

function runQuiz(o){
 let i=0,score=0;const wrong=[];o.items=o.items.slice();const B=o.battle;
 function next(){
  if(B&&B.over)return result(o,score,wrong);
  i++;if(B&&i>=o.items.length-2)o.items=o.items.concat(B.more());
  i<o.items.length?draw():result(o,score,wrong)}
 function done(ok){
  const it=o.items[i];

function drawSpell(it,el,done){
 const g=state.grade,w=it.w,letters=w.e.split('');
 const idx=letters.map((c,k)=>c!==' '?k:-1).filter(k=>k>=0);
 const nh=Math.min(idx.length,(g<=2?1:g<=4?2:Math.max(2,Math.ceil(idx.length*.5)))+(it.extra||0));
 /* 重考時：優先挑「上次沒挖空」的位置，讓空格換地方 */
 const prev=it.prevHoles||[],fresh=shuffle(idx.filter(k=>!prev.includes(k))),old=shuffle(idx.filter(k=>prev.includes(k)));
 const holes=fresh.concat(old).slice(0,nh).sort((a,b)=>a-b);
 it.holesUsed=holes;
 let filled=0,over=false;
 const decoys=pick('abcdefghijklmnoprstuwy'.split('').filter(c=>!holes.some(h=>letters[h].toLowerCase()==c)),g<=2?2:3);
 const tiles=shuffle(holes.map(h=>letters[h]).concat(decoys));

  <p class="qsub" style="margin-top:14px">依照順序點出缺少的字母（點錯一次就換下一題）</p><div class="tip" id="spmsg"></div>`;
 $('#sp').onclick=()=>say(w.e);

   el.querySelectorAll('.tile').forEach(x=>x.disabled=true);

   say(w.e);setTimeout(()=>done(false),2200);

function drawArrange(it,el,done,last){

}

function srsKeyOf(it){const f=it.fam;if(!f)return null;
 if(f.k=='word')return{key:'w|'+f.w.e,e:{k:'w',g:WG[f.w.e]||state.grade,e:f.w.e}};
 if(f.k=='rule')return{key:'r|'+state.grade+'|'+f.id,e:{k:'r',g:state.grade,id:f.id}};
 const ti=TPL.indexOf(f.t);return{key:'t|'+ti,e:{k:'t',g:f.t[0],ti}}}
function srsSave(){store.set('kidsEN_srs',SRS);store.set('kidsEN_srsstat',SRSSTAT)}
function srsAdd(it){const s=srsKeyOf(it);if(!s)return;SRS[s.key]=Object.assign(s.e,{box:0,due:dstr(1),r:it.review||'',n:(SRS[s.key]&&SRS[s.key].n||0)+1});srsSave()}
function srsUpdate(key,ok){const e=SRS[key];if(!e)return;
 if(ok){e.box++;if(e.box>=3){delete SRS[key];SRSSTAT.grad++;toast('🎓 這題從錯題本畢業了！')}else e.due=dstr(SRS_GAP[e.box])}
 else{e.box=0;e.due=dstr(1)}srsSave()}
function srsDue(){const t=dstr(0);return Object.keys(SRS).filter(k=>SRS[k].due<=t)}
function srsMake(key){const e=SRS[key],og=state.grade;state.grade=e.g;let it=null;
 try{if(e.k=='w'){const w=(WORDS[e.g]||[]).find(x=>x.e==e.e);if(w)it=wordItem(w,one(wordFmts(w,true)))}
  else if(e.k=='r'){if(GEN[e.id])it=ruleItem(e.id)}else if(TPL[e.ti])it=tplItem(TPL[e.ti])}finally{state.grade=og}
 if(it)it.srsKey=key;return it}
function reviewMenu(){
 const due=srsDue(),all=Object.keys(SRS),t=dstr(0);
 const dots=b=>'●'.repeat(b)+'○'.repeat(3-b);
 const list=all.sort((a,b)=>SRS[a].due<SRS[b].due?-1:1).map(k=>{const e=SRS[k];const d=e.due<=t?'<b style="color:var(--bad)">今天複習</b>':e.due==dstr(1)?'明天':e.due.slice(5).replace('-','/');
  return `<div class="srsrow"><span class="en">${esc(e.r)}</span><span class="srsmeta">${e.g}年級・${dots(e.box)}・${d}</span></div>`}).join('');
 app.innerHTML=topBar('📒 錯題本')+`<div class="panel">
  <div class="remedy-box">答錯的題目會自動收進錯題本，在 <b>1 天、3 天、7 天</b>後再出現。<br>複習答對 3 次（●●●）就畢業 🎓；又答錯就從頭開始。</div>
  <div class="stat" style="margin-top:14px"><span>今天要複習：<b style="color:var(--bad)">${due.length}</b></span><span>錯題本：<b>${all.length}</b></span><span>已畢業：<b>${SRSSTAT.grad}</b></span></div>
  <div class="row"><button class="btn" id="go" ${due.length?'':'disabled style="opacity:.5"'}>${due.length?`開始今日複習（${due.length} 題）▶`:'今天沒有要複習的題目 👍'}</button></div>
  ${all.length?`<h4 style="margin:20px 0 8px">錯題清單</h4><div>${list}</div>`:'<p class="qsub" style="margin-top:20px">錯題本是空的！去練習吧，答錯的題目會自動出現在這裡。</p>'}</div>`;
 if(due.length)$('#go').onclick=()=>{const items=shuffle(due.map(srsMake).filter(Boolean));
  runQuiz({title:'📒 錯題複習',items,review:true,replay:()=>go('review'),back:'review',onFinish:()=>dayFlag('reviewDone')})};
}

/* ===================== 每日任務＋連續天數 ===================== */
let DAY=null,STREAK=store.get('kidsEN_streak',{count:0,last:'',freeze:1});
function ensureDay(){if(!DAY)DAY=store.get('kidsEN_day',null);if(!DAY||DAY.date!==dstr(0)){DAY={date:dstr(0),correct:0,monsters:0,cards:0,reviewDone:false,rewarded:false,t3:srsDue().length?'review':'cards'};store.set('kidsEN_day',DAY)}return DAY}
function tasks(){const d=ensureDay();return[
 {ico:'✅',t:'答對 15 題',v:Math.min(d.correct,15),n:15},
 {ico:'👾',t:'打倒 1 隻怪獸',v:Math.min(d.monsters,1),n:1},
 d.t3=='review'?{ico:'📒',t:'完成錯題本複習',v:d.reviewDone?1:0,n:1}:{ico:'🃏',t:'看 10 張單字卡',v:Math.min(d.cards,10),n:10}]}
function dayInc(k,n){ensureDay();DAY[k]+=(n||1);store.set('kidsEN_day',DAY);checkDaily()}
function dayFlag(k){ensureDay();DAY[k]=true;store.set('kidsEN_day',DAY);checkDaily()}
function streakNow(){const s=STREAK;if(s.last==dstr(0)||s.last==dstr(-1))return s.count;if(s.last==dstr(-2)&&s.freeze>0)return s.count;return 0}
function checkDaily(){
 if(DAY.rewarded||!tasks().every(t=>t.v>=t.n))return;
 DAY.rewarded=true;store.set('kidsEN_day',DAY);
 const s=STREAK;let note='';
 if(s.last==dstr(-1))s.count++;
 else if(s.last==dstr(-2)&&s.freeze>0){s.freeze--;s.count++;note='<p>🧊 用掉 1 張冰凍卡，保住了連續紀錄！</p>'}
 else if(s.last!==dstr(0))s.count=1;
 s.last=dstr(0);if(s.count%7==0&&s.freeze<2){s.freeze++;note+='<p>🧊 連續 7 天！獲得 1 張冰凍卡（漏掉一天也不會斷）</p>'}
 store.set('kidsEN_streak',s);updateStars();
 setTimeout(()=>{popup(`<div style="font-size:70px">🔥</div><h2 style="margin:6px 0">連續 ${s.count} 天！</h2><p>今天的 3 個任務全部完成，太厲害了！</p>${note}`);beep(true)},700);
}
function dailyPanel(){const ts=tasks(),done=ts.filter(t=>t.v>=t.n).length,sk=streakNow();
 return `<div class="daily"><div class="dhead"><b>📅 今日任務 ${done}/3</b><span>🔥 連續 <b>${sk}</b> 天　🧊×${STREAK.freeze}</span></div>
 ${ts.map(t=>`<div class="drow ${t.v>=t.n?'ok':''}"><span>${t.v>=t.n?'✔️':t.ico}</span><span class="dt">${t.t}</span><div class="dbar"><i style="width:${t.v/t.n*100}%"></i></div><span class="dn">${t.v}/${t.n}</span></div>`).join('')}
 ${done==3?'<div class="dok">🎉 今天任務完成！明天再來保持連續紀錄</div>':''}</div>`}

/* ===================== 打怪模式 ===================== */
const MONS=[['🟢','字母史萊姆'],['🐙','拼字章魚'],['🦖','文法恐龍'],['👻','時態幽靈'],['🦂','句子毒蠍'],['🐉','單字魔王']];
let MONP=store.get('kidsEN_mon',{});
function battleMenu(){
 const g=state.grade,beat=MONP[g]||0;
 app.innerHTML=topBar('👾 打怪練習')+`<div class="panel">
  <div class="remedy-box">答對就攻擊怪獸，<b>連續答對 3 題以上會暴擊（傷害 ×2）</b>！<br>答錯會被怪獸打掉一顆 ❤️，3 顆都沒了就要重新挑戰。打倒怪獸會解鎖下一隻，最後是魔王！</div>
  <div class="papers">${MONS.map((m,k)=>{const lock=k>beat;return `<button class="ch mcard ${lock?'locked':''}" ${lock?'disabled':''} onclick="startBattle(${k})">
   <div style="font-size:46px">${lock?'🔒':m[0]}</div><b>${k==5?'👑 ':''}${m[1]}</b><span>${k==5?'魔王・血量 160':'血量 100'}</span><div class="stars">${lock?'先打倒前一隻':starStr(best[g+'_battle'+k]||0)}</div></button>`}).join('')}</div>
  <p class="qsub" style="margin-top:14px">${g} 年級已打倒 ${Math.min(beat,6)} / 6 隻</p></div>`;
}
function battleItems(n,boss){
 const g=state.grade,ws=boss?wordsUpTo(g):WORDS[g],rs=rulesFor('all',g),out=[];
 for(let k=0;k<n;k++){
  if(R()<.6||!rs.length){const w=one(ws);let f=one(wordFmts(w,false));if(spellable(w)&&R()<.2)f='spell';out.push(wordItem(w,f))}
  else out.push(ruleItem(one(rs)[0]));
 }return out}
function startBattle(k){
 const boss=k==5,m=MONS[k],B={k,boss,emo:m[0],name:m[1],hp:boss?160:100,max:boss?160:100,hearts:3,combo:0,maxCombo:0,over:false,win:false,more:()=>battleItems(15,boss)};
 runQuiz({title:(boss?'👑 ':'👾 ')+m[1],items:battleItems(25,boss),battle:B,replay:()=>startBattle(k),back:'battle'});
}
function battleHeader(B){
 return `<div class="arena"><div class="mon" id="mon">${B.emo}</div><div class="mname">${B.boss?'👑 ':''}${B.name}</div>
 <div class="hpbar"><i id="mhp" style="width:${B.hp/B.max*100}%"></i><span id="mhpn">${B.hp} / ${B.max}</span></div>
 <div class="arow"><span id="hearts">${'❤️'.repeat(B.hearts)}${'🤍'.repeat(3-B.hearts)}</span><span id="combo" class="combo">${B.combo>=2?'🔥 連擊 ×'+B.combo:''}</span></div>
 <div id="dmg" class="dmg"></div></div>`}
function battleHit(B,ok){
 const mon=$('#mon'),dmg=$('#dmg');
 if(ok){B.combo++;B.maxCombo=Math.max(B.maxCombo,B.combo);const crit=B.combo>=3,d=crit?20:10;B.hp=Math.max(0,B.hp-d);
  if(mon){mon.classList.remove('hit');void mon.offsetWidth;mon.classList.add('hit')}
  if(dmg){dmg.textContent=(crit?'💥 暴擊！':'⚔️ ')+'-'+d;dmg.className='dmg show'+(crit?' crit':'')}
  const bar=$('#mhp');if(bar)bar.style.width=(B.hp/B.max*100)+'%';const n=$('#mhpn');if(n)n.textContent=B.hp+' / '+B.max;
  const c=$('#combo');if(c)c.textContent=B.combo>=2?'🔥 連擊 ×'+B.combo:'';
  if(B.hp<=0){B.over=true;B.win=true;if(mon)mon.classList.add('dead')}}
 else{B.combo=0;B.hearts--;const a=document.querySelector('.arena');if(a){a.classList.remove('hurt');void a.offsetWidth;a.classList.add('hurt')}
  if(dmg){dmg.textContent='💔 被打到了！';dmg.className='dmg show bad'}
  const h=$('#hearts');if(h)h.textContent='❤️'.repeat(Math.max(0,B.hearts))+'🤍'.repeat(3-Math.max(0,B.hearts));
  if(B.hearts<=0){B.over=true;B.win=false}}
}

ensureDay();updateStars();home();

</script>
<script>
/* ===== 安裝到主畫面：Android 一鍵安裝、iPhone 圖解 ===== */
(function(){
  const standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  if(standalone||!location.protocol.startsWith('http'))return;
  const ua=navigator.userAgent,isIOS=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const inLine=/ Line\//i.test(ua),inFB=/FBAN|FBAV|Instagram/i.test(ua),isIOSChrome=/CriOS|FxiOS|EdgiOS/.test(ua),isAndroid=/Android/.test(ua);
  let deferred=null;
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;});
  window.addEventListener('appinstalled',()=>{bar&&bar.remove();toast('安裝完成！到主畫面找「英語冒險島」圖示');});
  let bar;
  function showBar(){
    try{if(sessionStorage.getItem('kidsEN_hideInstall'))return}catch(e){}
    bar=document.createElement('div');bar.className='installbar';
    bar.innerHTML='<b>📲 把英語冒險島裝到手機<br><small style="font-weight:400;opacity:.8">裝好後點圖示就能玩，不用網路</small></b><button class="btn" id="ib">裝到手機</button><button class="x" id="ix">×</button>';
    document.body.appendChild(bar);
    document.getElementById('ix').onclick=()=>{bar.remove();try{sessionStorage.setItem('kidsEN_hideInstall','1')}catch(e){}};
    document.getElementById('ib').onclick=install;
  }
  function modal(html){const m=document.createElement('div');m.className='imodal';m.innerHTML='<div class="box">'+html+'<button class="btn" style="width:100%">知道了</button></div>';m.onclick=e=>{if(e.target===m||e.target.tagName==='BUTTON')m.remove()};document.body.appendChild(m)}
  async function install(){
    if(deferred){deferred.prompt();const r=await deferred.userChoice;deferred=null;if(r.outcome==='accepted')bar&&bar.remove();return}
    if(inLine||inFB){
      modal(isIOS?'<h3>請先用 Safari 打開</h3><div class="note">現在是在 LINE 裡面打開的，LINE 裡沒辦法安裝。</div><ol><li>按右下角（或右上角）的 <b>⋯</b> 或 <b>分享</b></li><li>選「<b>在 Safari 中開啟</b>」或「<b>以瀏覽器開啟</b>」</li><li>在 Safari 裡再按一次「裝到手機」</li></ol>'
        :'<h3>請先用 Chrome 打開</h3><div class="note">現在是在 LINE 裡面打開的，LINE 裡沒辦法安裝。</div><ol><li>按右上角的 <b>⋮</b></li><li>選「<b>以其他應用程式開啟</b>」或「<b>以瀏覽器開啟</b>」→ <b>Chrome</b></li><li>在 Chrome 裡再按一次「裝到手機」</li></ol>');return}
    if(isIOS&&isIOSChrome){modal('<h3>請改用 Safari 打開</h3><div class="note">iPhone 只有 Safari 能把網頁裝到主畫面。</div><ol><li>複製這個網址：<br><b style="word-break:break-all">'+location.href.split('#')[0]+'</b></li><li>打開 <b>Safari</b> 貼上網址</li><li>再按一次「裝到手機」</li></ol>');return}
    if(isIOS){modal('<h3>iPhone 安裝 3 步驟</h3><ol><li>按畫面<b>最下面</b>中間的 <b>分享</b> 按鈕 <span style="font-size:22px">⬆️</span><br><small>（看不到的話，先往上滑一下畫面）</small></li><li>往下滑，選「<b>加入主畫面</b>」 <span style="font-size:22px">➕</span></li><li>右上角按「<b>新增</b>」</li></ol><div class="note">完成後回到手機桌面，就會看到「英語冒險島」圖示 🏝️</div><div class="arrowdown">👇</div>');return}
    modal('<h3>Android 安裝步驟</h3><ol><li>按 Chrome 右上角的 <b>⋮</b></li><li>選「<b>安裝應用程式</b>」或「<b>加到主畫面</b>」</li><li>按「<b>安裝</b>」</li></ol><div class="note">完成後回到手機桌面，就會看到「英語冒險島」圖示 🏝️</div>');
  }
  window.addEventListener('load',()=>setTimeout(showBar,600));
})();
</script>

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
