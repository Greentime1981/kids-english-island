<title>小小英語冒險島｜台北市國小英語練習</title>
<style>

  --bg:#FFF8EC; --ink:#2B2340; --muted:#7A7091; --card:#FFFFFF;
  --g1:#FF7A59; --g2:#FFB23F; --g3:#3CC79A; --g4:#2FA9E0; --g5:#7B6CF6; --g6:#E85BB3;
  --ok:#2EBD6B; --bad:#F2545B; --line:#EFE6D6; --accent:var(--g1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;min-height:100vh}
.en{font-family:"Arial Rounded MT Bold","Avenir Next",system-ui,"PingFang TC",sans-serif}
header{position:sticky;top:0;padding-top:max(10px,env(safe-area-inset-top))!important;z-index:5;background:var(--bg);border-bottom:2px dashed var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px}
header h1{font-size:20px;margin:0;font-weight:900;flex:1;cursor:pointer}
header h1 span{color:var(--accent)}
.starbox{background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700}
main{max-width:860px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
body{-webkit-user-select:none;user-select:none;overscroll-behavior:none}
.grades{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:6px 0 18px}
.gbtn{border:0;border-radius:16px;padding:10px 4px;font-weight:900;font-size:16px;color:#fff;cursor:pointer;opacity:.45;transition:.15s;font-family:inherit}
.gbtn.on{opacity:1;transform:translateY(-3px);box-shadow:0 5px 0 rgba(0,0,0,.15)}
.gbtn small{display:block;font-weight:500;font-size:11px}
.hero{background:var(--accent);color:#fff;border-radius:24px;padding:18px 20px;margin-bottom:18px;position:relative;overflow:hidden}
.hero h2{margin:0 0 4px;font-size:24px;font-weight:900}
.hero p{margin:0;opacity:.95;font-size:14px}
.hero .big{position:absolute;right:14px;top:6px;font-size:64px;opacity:.9}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.ch{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;cursor:pointer;transition:.15s;text-align:left;font-family:inherit;color:inherit}

.q{font-size:24px;font-weight:700;text-align:center;margin:10px 0 18px;line-height:1.5}

.opt:hover{border-color:var(--accent)}

.tip{margin-top:14px;padding:12px 14px;border-radius:14px;background:#FFF3D6;font-size:15px;display:none}

.btn{border:0;background:var(--accent);color:#fff;font-weight:900;font-size:17px;border-radius:16px;padding:12px 22px;cursor:pointer;font-family:inherit;box-shadow:0 4px 0 rgba(0,0,0,.15)}

.wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:16px}

.tile{width:52px;height:52px;border-radius:14px;border:0;background:var(--accent);color:#fff;font-size:26px;font-weight:800;font-family:"Arial Rounded MT Bold","Avenir Next",system-ui;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.tile.used{visibility:hidden}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.15)}}
/* translate */
.zh{font-size:26px;font-weight:900;text-align:center;margin:8px 0 16px}
.ansline{min-height:64px;border:2px dashed var(--accent);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-bottom:14px}
.wt{border:0;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-size:20px;font-weight:700;font-family:"Arial Rounded MT Bold","Avenir Next",system-ui;cursor:pointer;color:var(--ink)}
.ansline .wt{background:#FFF3D6;border-color:var(--accent)}
/* match */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mc{aspect-ratio:1/1.05;border-radius:16px;border:0;cursor:pointer;font-family:"Arial Rounded MT Bold","Avenir Next",system-ui,"PingFang TC";font-weight:800;font-size:18px;background:var(--accent);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15);padding:6px;line-height:1.2}
.mc.open{background:#fff;color:var(--ink);border:2px solid var(--accent)}
.mc.done{background:var(--ok);color:#fff;opacity:.55;cursor:default}
.mc .e{font-size:28px;display:block}
.stat{display:flex;gap:16px;justify-content:center;color:var(--muted);font-weight:700;margin-bottom:12px}
/* result */
.result{text-align:center;padding:20px}
.result .s{font-size:54px;letter-spacing:6px}
.result h2{font-size:30px;margin:8px 0}
.review{text-align:left;margin-top:16px;font-size:15px}
.review div{padding:8px 10px;border-radius:10px;background:#FFF0F0;margin-bottom:6px}
/* info */
.info h4{margin:18px 0 6px;font-size:17px}
.info p,.info li{font-size:15px;line-height:1.7}
.info table{border-collapse:collapse;width:100%;font-size:14px}
.info td,.info th{border:1px solid var(--line);padding:6px 8px;text-align:left}
.info th{background:#FFF3D6}
.info a{color:var(--g4)}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
@media (max-width:560px){
  .grades{grid-template-columns:repeat(3,1fr)}
  .q{font-size:20px}.opt{font-size:18px;padding:12px}
  .mgrid{grid-template-columns:repeat(3,1fr)}
  .flash .w{font-size:38px}
  .slot{width:36px;height:46px;font-size:24px}
}
.badge{display:inline-block;background:#FFE1A8;color:#8A5A00;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;margin-left:8px;vertical-align:middle}
.papers{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:14px}
.remedy-box{background:#EAF6FF;border-radius:16px;padding:14px;margin-top:14px;line-height:1.7;font-size:15px}
.revbanner{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:20px;padding:14px 16px;margin-bottom:14px;background:linear-gradient(90deg,#2FA9E0,#7B6CF6);color:#fff;cursor:pointer;font-family:inherit;text-align:left;box-shadow:0 5px 0 rgba(0,0,0,.12);animation:pulse 2s infinite}
.revbanner>span:first-child{font-size:34px}.revbanner b{flex:1;font-size:19px;font-weight:900}.revbanner small{display:block;font-size:13px;font-weight:500;opacity:.9}
.revbanner .go{background:#fff;color:#2F6FE0;border-radius:999px;padding:6px 12px;font-weight:900}
@keyframes pulse{50%{transform:scale(1.02)}}
.srsstat{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0 4px;text-align:center;font-size:12px;color:var(--muted)}
.srsstat div{background:#F6F2FF;border-radius:12px;padding:8px 2px}.srsstat b{display:block;font-size:20px;color:var(--ink)}
.mbar{letter-spacing:-1px;color:#2FA9E0}
.bubble{background:#EEF4FF;border-radius:18px;padding:12px 14px;margin:6px 0 12px}.bctx{font-size:14px;color:var(--muted);margin-bottom:6px}.bline{font-size:22px;font-weight:800}
.passage{background:#FFFBF2;border:2px solid #FFE3B0;border-radius:16px;padding:14px;font-size:18px;line-height:1.7;margin:4px 0 12px;text-align:left}
.exs{font-size:18px;color:#2F6FE0;margin:8px 0 2px;font-weight:700}
.skhead,.skrow{display:grid;grid-template-columns:92px 1fr 40px 54px 124px 46px;gap:6px;align-items:center;font-size:14px}
.skrow{padding:7px 0;border-bottom:1px dashed var(--line)}.skn{font-weight:700}
.skbar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}.skbar i{display:block;height:100%}
.skp{font-weight:900;text-align:right}.skg{color:#fff;border-radius:999px;text-align:center;font-size:12px;font-weight:700;padding:2px 0}
.sktr{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;color:var(--muted);font-size:12px}.skhead .tw{font-size:10px}
.skgo{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:5px 0;font-weight:700;cursor:pointer;font-family:inherit}
.warnbox{background:#FFECEC;border-radius:14px;padding:12px;margin-top:12px;line-height:1.7;font-size:15px}.okbox{background:#E7F8EE;border-radius:14px;padding:12px;margin-top:12px;font-weight:700}
.weekbanner{display:flex;align-items:center;gap:12px;width:100%;border:2px solid #FFD08A;border-radius:20px;padding:12px 14px;margin-bottom:14px;background:#FFFBF2;color:var(--ink);cursor:pointer;font-family:inherit;text-align:left}
.weekbanner>span:first-child{font-size:28px}.weekbanner b{flex:1;font-size:17px}.weekbanner small{display:block;font-size:13px;font-weight:500;color:var(--muted)}.weekbanner .go{background:var(--accent);color:#fff;border-radius:999px;padding:6px 12px;font-weight:900}
.semh{margin:18px 0 8px;font-size:19px}.tcard{border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:10px;background:#fff}
.thead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.thead span{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-size:15px;cursor:pointer;font-family:"Arial Rounded MT Bold","Avenir Next",system-ui,"PingFang TC";color:var(--ink)}
.chip.ext{border-color:#FFD08A;background:#FFFBF2}.chip small{margin-left:4px;color:var(--muted);font-family:inherit}
.tbtns{display:flex;gap:8px;margin-top:8px}.tbtns .btn{padding:8px 14px;font-size:15px}
.cw{width:100%;min-height:120px;border:2px solid var(--line);border-radius:14px;padding:10px;font-size:16px;font-family:inherit}
.ch.locked{opacity:.55}.drow.tap{cursor:pointer}.drow.tap .dt{text-decoration:underline dotted}
@media (max-width:560px){.skhead,.skrow{grid-template-columns:80px 1fr 36px 50px 0 42px}.sktr{display:none}}
.hasbar main{padding-bottom:150px}
.teasebtn{border:2px dashed var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-family:inherit;font-size:14px;color:var(--muted);cursor:pointer}
.extb{display:inline-block;background:#FFF0D9;color:#B35C00;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700;margin-bottom:6px}
.wl.ext{border-color:#FFD08A;background:#FFFBF2}
.slot.reveal{background:#FFE3E3;border-color:var(--bad);color:var(--bad)}
.tile.wrongtile{background:var(--bad)}
.tile:disabled{opacity:.6;cursor:default}
.retry{background:#FFF0D9;color:#8A5A00;border-radius:12px;padding:8px 12px;font-weight:700;text-align:center;margin-bottom:10px}
.opt.en{font-family:"Arial Rounded MT Bold","Avenir Next",system-ui,"PingFang TC",sans-serif}
.installbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;background:#2B2340;color:#fff;border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.installbar b{flex:1;font-size:15px;line-height:1.4}
.installbar .btn{padding:10px 16px;font-size:16px;white-space:nowrap}
.installbar .x{background:none;border:0;color:#bbb;font-size:22px;cursor:pointer;padding:0 4px}
.imodal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.imodal .box{background:#fff;border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:520px}
.imodal h3{margin:0 0 12px;font-size:21px}
.imodal ol{margin:0 0 16px;padding-left:22px;font-size:18px;line-height:1.9}
.imodal .note{background:#FFF3D6;border-radius:12px;padding:10px 12px;font-size:15px;margin-bottom:14px}
.arrowdown{text-align:center;font-size:40px;animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(8px)}}
.daily{background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px 16px;margin-bottom:16px}
.dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:15px;flex-wrap:wrap;gap:4px}
.dhead span{color:var(--muted);font-weight:700}
.drow{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:15px}

.dbar{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}.dbar i{display:block;height:100%;background:var(--ok)}
.dn{width:44px;text-align:right;color:var(--muted);font-weight:700;font-size:13px}
.dok{margin-top:6px;background:#E7F8EE;border-radius:10px;padding:6px 10px;font-size:14px;font-weight:700;color:#1E8A4C}
.srsrow{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-bottom:1px dashed var(--line);font-size:15px}
.srsmeta{color:var(--muted);font-size:13px;white-space:nowrap}
.mcard.locked{opacity:.45;cursor:not-allowed}
.arena{position:relative;text-align:center;background:linear-gradient(180deg,#EEF4FF,#fff);border-radius:20px;padding:12px 10px 10px;margin-bottom:10px}
.arena.hurt{animation:hurt .45s}@keyframes hurt{0%,100%{background:#EEF4FF}40%{background:#FFD6D6;transform:translateX(-6px)}70%{transform:translateX(6px)}}

@keyframes idle{50%{transform:translateY(-6px)}}

.mname{font-weight:900;font-size:17px;margin:2px 0 6px}

.hpbar span{position:absolute;inset:0;font-size:12px;font-weight:700;line-height:18px;color:#5a1a1a}
.arow{display:flex;justify-content:space-between;max-width:360px;margin:8px auto 0;font-size:18px;min-height:24px}
.combo{color:#E8590C;font-weight:900;font-size:16px}

@keyframes dmg{0%{opacity:0;transform:translateY(10px)}20%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}

.iosg-ipad .ioscard{top:96px;bottom:auto}

.iosfoot{font-size:13px;color:var(--muted);margin:6px 0 10px}
.iosbtns{display:flex;flex-direction:column;gap:8px}.iosbtns .btn{width:100%}
.iosno{background:none;border:0;color:var(--muted);font-size:14px;text-decoration:underline;cursor:pointer;font-family:inherit}
.iosguide-on .installbar{display:none}
.iosarrow .lbl{display:inline-block;font-size:15px;font-weight:900;color:#fff;background:#E8590C;border-radius:999px;padding:4px 12px;white-space:nowrap;margin-bottom:4px;text-align:center}
.iosarrow{position:absolute;text-align:center;font-size:64px;line-height:1;animation:iosbob 1s infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}

.iosg-new .iosarrow{right:6px;text-align:right;bottom:calc(14px + env(safe-area-inset-bottom))}

</style>
</head>

let state={grade:1};
function L(list){const r=list.filter(x=>x.g<=state.grade);if(r.length)return r;const m=Math.min(...list.map(x=>x.g));return list.filter(x=>x.g==m)}
const art=e=>/^[aeiou]/i.test(e)?'an':'a';
const aN=e=>art(e)+' '+e;
const toP=pl=>pl.a=='0'?pl.e:'the '+pl.e;
const fill=(q,a)=>q.replace('___',a);
function MC(q,ans,wr,tip){const o=[ans];for(const w of wr)if(!o.includes(w))o.push(w);return{type:'mc',q,ans,opts:shuffle(o),tip,speak:true}}

want_to(){const v=one(L(VERBS));if(R()<.5)return MC(`I want ___ ${v.b}. (我想要${v.z})`,'to',['for','at'],'want to + 原形動詞');
 return MC(`She wants to ___. (她想要${v.z})`,v.b,[v.s,v.i],'want to 後面接原形動詞')},
modal(){const m=one([['should','應該'],['must','必須'],['can','可以'],['will','將會']]),v=one(L(VERBS));
 return MC(`You ${m[0]} ___. (你${m[1]}${v.z})`,v.b,[v.s,v.i],`${m[0]} 是助動詞，後面接原形動詞`)},
time_prep(){const r=R();if(r<.35){const m=one(MONTHS);return MC(`My birthday is ___ ${m.e}. (在${m.z})`,'in',['on','at'],'月份、季節、年前面用 in')}
 if(r<.7){const d=one(['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']);return MC(`We have music class ___ ${d}.`,'on',['in','at'],'星期幾、日期前面用 on')}
 const n=one(L(NUMS));return MC(`I go to bed ___ ${n.e} o'clock.`,'at',['in','on'],'幾點鐘前面用 at')},

 const n=one(NAMES)[0];return MC(`${n} will ___ next week.`,v.b,[v.s,v.p],'will 後面接原形動詞')},

 return MC(`We are going ___ ${v.b} this weekend.`,'to',['for','at'],'be going to + 原形動詞，表示「打算」')},

 return MC(`I didn't ___ yesterday.`,v.b,[v.p,v.i],"didn't 後面接原形動詞")},
tense_mix(){const v=one(L(VERBS)),n=one(NAMES)[0],k=one(['yesterday','now','every day','tomorrow']);
 const ans={yesterday:v.p,now:'is '+v.i,'every day':v.s,tomorrow:'will '+v.b}[k];
 const tip={yesterday:'yesterday → 過去式',now:'now → 現在進行式',['every day']:'every day → 現在簡單式（第三人稱加 s）',tomorrow:'tomorrow → 未來式 will'}[k];
 const all=[v.p,'is '+v.i,v.s,'will '+v.b].filter(x=>x!==ans);
 return MC(`${n} ___ ${k}.`,ans,pick(all,2),'看時間詞決定時態：'+tip)}

};

function misspell(w){const out=new Set(),L2=w.length;for(let n=0;n<40&&out.size<2;n++){const k=1+(R()*(L2-2)|0),r=R();let v;
 if(r<.33)v=w.slice(0,k)+w[k+1]+w[k]+w.slice(k+2);else if(r<.66)v=w.slice(0,k)+w.slice(k+1);else v=w.slice(0,k)+w[k]+w.slice(k);
 if(v&&v!==w)out.add(v)}return[...out]}
/* 發音相同的字，聽力題不能同時出現 */
const HOMO=[['i','eye'],['four','for'],['son','sun'],['may'],['hour','our'],['no','know'],['there','their'],['by','buy'],['wear','where'],['two','to','too']];
const spellable=w=>/^[A-Za-z ]+$/.test(w.e)&&w.e.replace(/ /g,'').length>=3;
function wordFmts(w,withSpell){const f=['enzh','zhen','listen'];if(/^[A-Za-z]{4,}$/.test(w.e))f.push('spellc');if(withSpell&&spellable(w))f.push('spell');return f}
function wordItem(w,f){
 const all=wordsUpTo(state.grade),dz=()=>pick(all.filter(x=>x.z!==w.z),6).map(x=>x.z),de=()=>pick(all.filter(x=>x.e!==w.e&&x.z!==w.z),6).map(x=>x.e);
 const base={fam:{k:'word',w},review:`${w.m} ${w.e}＝${w.z}`};
 const mk=(o,ans,wr)=>{const op=[ans];for(const x of wr){if(op.length>=3)break;if(!op.includes(x))op.push(x)}return Object.assign({type:'mc',ans,opts:shuffle(op)},o,base)};
 if(f=='spell')return Object.assign({type:'spell',w},base);
 if(f=='enzh')return mk({pre:w.m+' ',q:w.e,sub:'這個單字是什麼意思？',sayFirst:w.e,sayAfter:w.e},w.z,dz());
 if(f=='zhen')return mk({pre:w.m+' ',q:w.z,sub:'英文怎麼說？',sayAfter:w.e},w.e,de());
 if(f=='listen'){const hs=HOMO.find(h=>h.includes(w.e.toLowerCase()))||[];return mk({q:'🎧 聽一聽，是哪個單字？',sub:'按「再聽一次」可以重聽',listen:w.e},w.e,de().filter(e=>!hs.includes(e.toLowerCase())))}
 const ms=misspell(w.e);if(ms.length<2)return wordItem(w,'zhen');
 return mk({pre:w.m+' ',q:w.z,sub:'哪一個拼字是正確的？',sayAfter:w.e},w.e,ms);
}
function ruleItem(id){const it=GEN[id]();it.fam={k:'rule',id};it.review=fill(it.q,it.ans);return it}
function tplItem(t){const[zh,en]=t[1]();return{type:'arrange',zh,en,fam:{k:'tpl',t},review:`${zh} → ${en}`}}
function distinct(make,n,key,tries){const out=[],seen=new Set();for(let k=0;k<(tries||n*12)&&out.length<n;k++){const it=make();const s=key(it);if(!seen.has(s)){seen.add(s);out.push(it)}}return out}
/* 錯一題 → 產生 3 題類似題 */
function makeLike(fam,n){
 if(fam.k=='word'){const f=shuffle(wordFmts(fam.w,true));const out=[];for(let k=0;k<n;k++)out.push(wordItem(fam.w,f[k%f.length]));return out}
 if(fam.k=='rule'){const out=distinct(()=>ruleItem(fam.id),n,x=>x.q);while(out.length<n)out.push(ruleItem(fam.id));return out}
 if(fam.k=='x'){const out=distinct(()=>xItem(fam.id),n,x=>x.q+x.ans+(x.listen||''),n*15);while(out.length<n)out.push(xItem(fam.id));return out}
 let out=distinct(()=>tplItem(fam.t),n,x=>x.zh);
 const same=TPL.filter(t=>t[0]==fam.t[0]&&t!==fam.t);while(out.length<n)out.push(tplItem(one(same.length?same:TPL)));return out;
}

/* ===================== 模擬考：學習內容 × 3 ===================== */
const EXAM={};
function examInfo(g){
 if(EXAM[g])return EXAM[g];
 const old=R,oldG=state.grade;R=seeded(g*9973+7);state.grade=g;
 try{
  const words=WORDS[g],rules=rulesFor('all',g),tpls=TPL.filter(t=>t[0]==g);let items=[];
  words.forEach(w=>{shuffle(wordFmts(w,false)).slice(0,3).forEach(f=>items.push(wordItem(w,f)))});
  rules.forEach(r=>{items=items.concat(makeLike({k:'rule',id:r[0]},3))});
  tpls.forEach(t=>{items=items.concat(makeLike({k:'tpl',t},3))});
  const xg=XGEN.filter(x=>x.min<=g&&g<=x.max&&(x.cat!=='phonics'||g<=4));xg.forEach(x=>{items=items.concat(makeLike({k:'x',id:x.id},3))});
  items=shuffle(items);const papers=[];for(let k=0;k<items.length;k+=20)papers.push(items.slice(k,k+20));
  if(papers.length>1&&papers[papers.length-1].length<8){const last=papers.pop();papers[papers.length-1]=papers[papers.length-1].concat(last)}
  return EXAM[g]={total:items.length,papers,rules,tpls,words:words.length,xg};
 }finally{R=old;state.grade=oldG}
}

/* ===================== 通用作答引擎 ===================== */
function runQuiz(o){
 let i=0,score=0;const wrong=[];o.items=o.items.slice();const B=o.battle;
 function next(){
  if(B&&B.over)return result(o,score,wrong);
  i++;if(B&&i>=o.items.length-2)o.items=o.items.concat(B.more());
  i<o.items.length?draw():result(o,score,wrong)}
 function done(ok){
  const it=o.items[i];
  if(!it.retry){if(ok){score++;dayInc('correct')}else wrong.push(it);if(!it.srsKey)srsTouch(it,ok);recordSkill(it,ok)}
  if(it.srsKey&&!it.retry)srsUpdate(it.srsKey,ok);
  /* 複習時答錯：同一回合 3 題後換個題型再考一次 */
  if(!ok&&o.review&&it.srsKey&&!it.retry&&it.type!=='spell'){const again=srsMake(it.srsKey);if(again){again.retry=1;o.items.splice(Math.min(i+4,o.items.length),0,again)}}
  /* 填空單字錯了：3 題後再出一次，空格換位置、多一個空格（最多重考 3 次） */
  if(!ok&&it.type=='spell'&&(it.retry||0)<3){
   const again=Object.assign({},it,{retry:(it.retry||0)+1,extra:(it.extra||0)+1,prevHoles:it.holesUsed,srsKey:null});
   o.items.splice(Math.min(i+4,o.items.length),0,again);
  }
  if(B){battleHit(B,ok);setTimeout(next,B.over?1100:750);return}
  next()}
 function draw(){
  const it=o.items[i];window.scrollTo(0,0);
  const head=B?battleHeader(B):`<div class="prog"><i style="width:${i/o.items.length*100}%"></i></div>
   <div style="display:flex;justify-content:space-between;color:var(--muted);font-weight:700"><span>答對 ${score}</span><span>${i+1} / ${o.items.length}</span></div>`;
  app.innerHTML=topBar(o.title+(o.remedial?'<span class="badge">補充習題</span>':'')+(o.review?'<span class="badge">間隔複習</span>':''))+`<div class="panel">${head}<div id="body"></div></div>`;
  ({mc:drawMC,spell:drawSpell,arrange:drawArrange})[it.type](it,$('#body'),done,!B&&i+1==o.items.length);
 }
 draw();
}

  if(!ok)b.classList.add('bad');beep(ok);
  const s=it.sayAfter||(it.speak?fill(it.q,it.ans).replace(/\s*\(.*?\)/g,''):'');if(!ok)tease(s);else if(s)say(s);
  const tip=$('#tip');tip.innerHTML=(ok?'✅ '+one(praise):'💡 正確答案是 <b class="en">'+esc(it.ans)+'</b>')+(it.tip?'<br>'+it.tip:'')+(!ok&&it.fam?'<br><small>📘 這題會加 3 題補充習題</small>':'');tip.classList.add('show');

 });

function drawSpell(it,el,done){
 const g=state.grade,w=it.w,letters=w.e.split('');
 const idx=letters.map((c,k)=>c!==' '?k:-1).filter(k=>k>=0);
 const ratio=g<=2?.4:g<=4?.5:.65,base=Math.max(2,Math.ceil(idx.length*ratio));
 /* 至少挖 2 格；1～4 年級保留至少 1 個字母當提示，5～6 年級重考時可以整個字都要拼 */
 const cap=(g<=4||!it.retry)?Math.max(1,idx.length-1):idx.length;
 const nh=Math.min(cap,base+(it.extra||0));
 /* 重考時：優先挑「上次沒挖空」的位置，讓空格換地方 */
 const prev=it.prevHoles||[],fresh=shuffle(idx.filter(k=>!prev.includes(k))),old=shuffle(idx.filter(k=>prev.includes(k)));
 const holes=fresh.concat(old).slice(0,nh).sort((a,b)=>a-b);
 it.holesUsed=holes;
 let filled=0,over=false;
 const decoys=pick('abcdefghijklmnoprstuwy'.split('').filter(c=>!holes.some(h=>letters[h].toLowerCase()==c)),g<=2?2:3);
 const tiles=shuffle(holes.map(h=>letters[h]).concat(decoys));
 el.innerHTML=`${it.retry?`<div class="retry">🔁 再挑戰第 ${it.retry} 次：空格換位置了，有 ${holes.length} 個空格！</div>`:''}<div class="flash" style="padding:0"><div class="emo">${w.m}</div><div class="z" style="font-size:24px;color:var(--ink);font-weight:700">${w.z}</div></div>
  <div class="row" style="margin:6px 0"><button class="speak" id="sp">🔊</button></div>
  <div class="slots">${letters.map((c,k)=>c===' '?'<div class="slot sp"></div>':holes.includes(k)?`<div class="slot hole" data-k="${k}">_</div>`:`<div class="slot en">${c}</div>`).join('')}</div>
  <div class="tiles">${tiles.map(c=>`<button class="tile" data-c="${c}">${c}</button>`).join('')}</div>
  <p class="qsub" style="margin-top:14px">依照順序點出缺少的字母（點錯一次就換下一題）</p><div class="tip" id="spmsg"></div>`;
 $('#sp').onclick=()=>say(w.e);
 const mark=()=>el.querySelectorAll('.slot.hole').forEach(s=>s.classList.toggle('cur',+s.dataset.k===holes[filled]));mark();
 el.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{
  if(over||filled>=holes.length)return;const need=letters[holes[filled]];
  if(t.dataset.c===need){const s=el.querySelector(`.slot[data-k="${holes[filled]}"]`);s.textContent=need;s.classList.remove('hole','cur');s.classList.add('pop','en');
   t.classList.add('used');filled++;beep(true);mark();
   if(filled===holes.length){over=true;say(w.e);toast(one(praise));setTimeout(()=>done(true),1100)}}
  else{
   /* 填錯：顯示正確答案，直接進下一題，這個字稍後換空格重考 */
   over=true;t.classList.add('wrongtile','shake');beep(false);
   el.querySelectorAll('.slot.hole').forEach(s=>{s.textContent=letters[+s.dataset.k];s.classList.remove('hole','cur');s.classList.add('reveal','en')});
   el.querySelectorAll('.tile').forEach(x=>x.disabled=true);
   $('#spmsg').innerHTML=`❌ 正確拼法是 <b class="en">${w.e}</b><br>等一下會換空格位置再考一次！`;$('#spmsg').classList.add('show');
   tease(w.e);setTimeout(()=>done(false),2600);
  }
 });
 setTimeout(()=>say(w.e),300);
}
function drawArrange(it,el,done,last){
 const tokens=it.en.split(' ');let chosen=[],tries=0,finished=false;
 let bank=shuffle(tokens.map(t=>({t})));if(bank.map(b=>b.t).join(' ')===it.en&&tokens.length>1)bank=bank.reverse();
 function paint(msg){
  el.innerHTML=`<div class="zh">${it.zh}</div>
   <div class="ansline">${chosen.length?chosen.map((c,k)=>`<button class="wt" data-a="${k}">${esc(c.t)}</button>`).join(''):'<span style="color:var(--muted)">點下面的單字，排成英文句子</span>'}</div>
   <div class="tiles">${bank.map((b,k)=>`<button class="wt" data-b="${k}">${esc(b.t)}</button>`).join('')}</div>
   <div class="tip ${msg?'show':''}" id="tip">${msg||''}</div>
   <div class="row">${finished?`<button class="btn" id="nx">${last?'看成績 🎉':'下一題 →'}</button>`:`<button class="btn ghost" id="rs">重來</button><button class="btn" id="ck">檢查 ✔</button>`}</div>`;
  if(finished){$('#nx').onclick=()=>done(tries==0);return}
  el.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{chosen.push(bank.splice(+b.dataset.b,1)[0]);paint()});
  el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{bank.push(chosen.splice(+b.dataset.a,1)[0]);paint()});
  $('#rs').onclick=()=>{bank=bank.concat(chosen);chosen=[];paint()};
  $('#ck').onclick=()=>{
   if(bank.length){toast('還有單字沒用到喔');return}
   if(chosen.map(c=>c.t).join(' ')===it.en){beep(true);say(it.en);finished=true;paint((tries?'✅ 這次對了！':'✅ '+one(praise))+' <b class="en">'+esc(it.en)+'</b>'+(tries?'<br><small>📘 這句會加 3 題補充習題</small>':''))}
   else{beep(false);tries++;if(tries==1){tease();bank=bank.concat(chosen);chosen=[];paint('🤔 順序不太對，再試一次！提示：第一個字是 <b class="en">'+esc(tokens[0])+'</b>')}
    else{tease(it.en);finished=true;paint('💡 正確句子：<b class="en">'+esc(it.en)+'</b><br><small>📘 這句會加 3 題補充習題</small>')}}
  };
 }
 paint();
}
function result(o,score,wrong){
 const B=o.battle,total=B?score+wrong.length:o.items.filter(x=>!x.retry).length;
 let s=starsFor(score/Math.max(1,total)),head,msg;
 if(B){
  s=B.win?B.hearts:0;
  if(B.win){saveBest('battle'+B.k,s);const g=state.grade;MONP[g]=Math.max(MONP[g]||0,B.k+1);store.set('kidsEN_mon',MONP)}
  head=B.win?`<div style="font-size:80px">🏆</div><h2>打倒了${B.name}！</h2>`:`<div style="font-size:80px">${B.emo}</div><h2>被${B.name}打敗了…</h2>`;
  msg=B.win?(B.boss?'你打倒了魔王！這個年級的單字你都很熟了 👑':'下一隻怪獸已經解鎖！')+`<br><small>答對 ${score} 題・最高連擊 ${B.maxCombo}</small>`:'沒關係，複習一下再來挑戰！💪';
 }else{
  if(!o.remedial&&o.saveKey)saveBest(o.saveKey,s);
  head=`<h2>${score} / ${total}</h2>`;
  msg=wrong.length?(s==3?'超級厲害！🏆':s==2?'很不錯喔！再一次就滿分！':s==1?'有進步！多練幾次會更棒':'沒關係，再試一次！💪'):(o.remedial?'補充習題全對！觀念都弄懂了 🎉':o.review?'今天的錯題全部答對！🎓':'全部答對！超級厲害！🏆');
 }
 const backName={mock:'回模擬考目錄',battle:'回怪獸列表',review:'回錯題本'}[o.back]||'回島上';
 window.scrollTo(0,0);
 app.innerHTML=topBar(o.remedial?'補充習題成績':B?'戰鬥結果':o.review?'複習成績':'成績單')+`<div class="panel result">

   <div class="review"><b>答錯的題目：</b>${wrong.map(w=>`<div class="en">${esc(w.review||'')}${w.tip?'<br><small>'+w.tip+'</small>':''}</div>`).join('')}</div>`:''}
  <div class="row"><button class="btn ${wrong.length?'ghost':''}" id="again">${o.remedial?'回到原本的練習':B?(B.win?'再打一次':'重新挑戰'):'再玩一次'}</button><button class="btn ghost" onclick="go('${o.back||'home'}')">${backName}</button></div></div>`;
 if(wrong.length)$('#rem').onclick=()=>{const items=shuffle(wrong.flatMap(w=>makeLike(w.fam,3)));runQuiz({title:o.title,items,remedial:true,replay:o.replay,back:o.back})};

function match(){
 const ws=pick(WORDS[state.grade],6);
 const cards=shuffle(ws.flatMap((w,k)=>[{k,html:`<span class="en">${w.e}</span>`,say:w.e},{k,html:`<span class="e">${w.m}</span>${w.z}`}]));
 let open=[],done=0,moves=0,t0=Date.now(),lock=false;
 app.innerHTML=topBar('🎴 翻牌配對')+`<div class="panel"><div class="stat"><span>步數：<b id="mv">0</b></span><span>時間：<b id="tm">0</b> 秒</span></div>
 <div class="mgrid">${cards.map((c,i)=>`<button class="mc" data-i="${i}">?</button>`).join('')}</div><p class="qsub" style="margin-top:14px">翻開兩張，英文和中文意思一樣就配對成功！</p></div>`;
 const timer=setInterval(()=>{const e=$('#tm');if(!e){clearInterval(timer);return}e.textContent=((Date.now()-t0)/1000|0)},500);
 app.querySelectorAll('.mc').forEach(b=>b.onclick=()=>{
  const c=cards[+b.dataset.i];if(lock||b.classList.contains('open')||b.classList.contains('done'))return;
  b.classList.add('open');b.innerHTML=c.html;if(c.say)say(c.say);open.push(b);
  if(open.length==2){moves++;$('#mv').textContent=moves;const[a,d]=open;
   if(cards[+a.dataset.i].k===cards[+d.dataset.i].k){beep(true);a.classList.add('done');d.classList.add('done');open=[];done++;

const WG={};for(let g=6;g>=1;g--)WORDS[g].forEach(w=>WG[w.e]=g);

function srsKeyOf(it){const f=it.fam;if(!f)return null;
 if(f.k=='word')return{key:'w|'+f.w.e,e:{k:'w',g:WG[f.w.e]||state.grade,e:f.w.e}};
 if(f.k=='rule')return{key:'r|'+state.grade+'|'+f.id,e:{k:'r',g:state.grade,id:f.id}};
 if(f.k=='x')return{key:'x|'+state.grade+'|'+f.id,e:{k:'x',g:state.grade,id:f.id}};
 const ti=TPL.indexOf(f.t);return{key:'t|'+ti,e:{k:'t',g:f.t[0],ti}}}
function srsSave(){store.set('kidsEN_srs',SRS);store.set('kidsEN_srsstat',SRSSTAT)}
/* 一般練習時答過的題目：第一次見到就排進複習；已在複習中，答錯退回、到期答對算一次複習 */
function srsTouch(it,ok){const s=srsKeyOf(it);if(!s)return;const t=dstr(0),e=SRS[s.key];
 if(!e){SRS[s.key]=Object.assign(s.e,{box:ok?1:0,due:ok?dstr(1):t,r:it.review||'',n:ok?0:1,first:t});srsSave();return}
 if(!ok){e.box=0;e.due=t;e.n=(e.n||0)+1;e.r=it.review||e.r;srsSave()}
 else if(e.due<=t)srsUpdate(s.key,true)}
function srsUpdate(key,ok){const e=SRS[key];if(!e)return;
 if(ok){e.box++;if(e.box>=SRS_GAP.length){delete SRS[key];SRSSTAT.grad++;toast('🏆 這題已經熟練，記到長期記憶了！')}else e.due=dstr(SRS_GAP[e.box])}
 else{e.box=0;e.due=dstr(0);e.n=(e.n||0)+1}srsSave()}
function srsDue(){const t=dstr(0);return Object.keys(SRS).filter(k=>SRS[k].due<=t).sort((a,b)=>SRS[a].box-SRS[b].box||(SRS[b].n||0)-(SRS[a].n||0))}
function srsMake(key){const e=SRS[key],og=state.grade;state.grade=e.g;let it=null;
 try{if(e.k=='w'){const w=(WORDS[e.g]||[]).find(x=>x.e==e.e)||findWord(e.e);if(w)it=wordItem(w,one(wordFmts(w,true)))}
  else if(e.k=='x'){if(XGEN.find(x=>x.id===e.id))it=xItem(e.id)}
  else if(e.k=='r'){if(GEN[e.id])it=ruleItem(e.id)}else if(TPL[e.ti])it=tplItem(TPL[e.ti])}finally{state.grade=og}
 if(it)it.srsKey=key;return it}

  case 'transport':return `I go to school by ${e}.`;

function skillOf(it){if(it.skill)return it.skill;if(it.type==='spell')return 'spell';if(it.type==='arrange')return 'sentence';
 if(it.fam&&it.fam.k==='rule')return 'grammar';if(it.listen)return 'listen';if(it.fam&&it.fam.k==='word')return /拼字/.test(it.sub||'')?'spell':'vocab';return 'vocab'}
function recordSkill(it,ok){const d=dstr(0),sk=skillOf(it);STATS[d]=STATS[d]||{};const a=STATS[d][sk]=STATS[d][sk]||[0,0];if(ok)a[0]++;a[1]++;
 const keys=Object.keys(STATS).sort();if(keys.length>150)keys.slice(0,keys.length-150).forEach(k=>delete STATS[k]);store.set('kidsEN_stats',STATS)}
function statRange(from,to){const out={};for(const d in STATS){if(d>=from&&d<=to)for(const sk in STATS[d]){const o=out[sk]=out[sk]||[0,0];o[0]+=STATS[d][sk][0];o[1]+=STATS[d][sk][1]}}return out}
function rate(a){return a&&a[1]?a[0]/a[1]:null}
function grade5(r){return r==null?['—','資料不足','#bbb']:r>=.9?['A','優秀','#2EBD6B']:r>=.75?['B','良好','#3CC79A']:r>=.6?['C','普通','#FFB23F']:['D','待加強','#F2545B']}
function weakestSkill(){const s=statRange(dstr(-13),dstr(0));let best=null,low=2;
 for(const k in SKILLS){const a=s[k];if(a&&a[1]>=8&&a[0]/a[1]<low){low=a[0]/a[1];best=k}}

function skillItems(sk,n){
 const g=state.grade,ws=WORDS[g].length>=8?WORDS[g]:wordsUpTo(g),out=[];
 const xs=id=>XGEN.filter(x=>x.cat===id&&x.min<=g&&g<=x.max);
 for(let k=0;k<n*3&&out.length<n;k++){
  const w=one(ws);let it=null;

  else if(sk==='spell')it=spellable(w)&&R()<.5?wordItem(w,'spell'):wordItem(w,/^[A-Za-z]{4,}$/.test(w.e)?'spellc':'zhen');
  else if(sk==='listen')it=R()<.6?wordItem(w,'listen'):(xs('talk').length?xItem(one(xs('talk')).id):wordItem(w,'listen'));
  else if(sk==='grammar'){const rs=rulesFor('all',g);it=rs.length?ruleItem(one(rs)[0]):null}

  if(it)out.push(it);
 }return out}

    if(deferred){deferred.prompt();const r=await deferred.userChoice;deferred=null;if(r.outcome==='accepted')bar&&bar.remove();return}
    if(inLine||inFB){
      modal(isIOS?'<h3>請先用 Safari 打開</h3><div class="note">現在是在 LINE 裡面打開的，LINE 裡沒辦法安裝。</div><ol><li>按右下角（或右上角）的 <b>⋯</b> 或 <b>分享</b></li><li>選「<b>在 Safari 中開啟</b>」或「<b>以瀏覽器開啟</b>」</li><li>在 Safari 裡再按一次「裝到手機」</li></ol>'
        :'<h3>請先用 Chrome 打開</h3><div class="note">現在是在 LINE 裡面打開的，LINE 裡沒辦法安裝。</div><ol><li>按右上角的 <b>⋮</b></li><li>選「<b>以其他應用程式開啟</b>」或「<b>以瀏覽器開啟</b>」→ <b>Chrome</b></li><li>在 Chrome 裡再按一次「裝到手機」</li></ol>');return}
    if(isIOS&&isIOSChrome){modal('<h3>請改用 Safari 打開</h3><div class="note">iPhone 只有 Safari 能把網頁裝到主畫面。</div><ol><li>複製這個網址：<br><b style="word-break:break-all">'+location.href.split('#')[0]+'</b></li><li>打開 <b>Safari</b> 貼上網址</li><li>再按一次「裝到手機」</li></ol>');return}
    if(isIOS){iosGuide(true);return}
    modal('<h3>Android 安裝步驟</h3><ol><li>按 Chrome 右上角的 <b>⋮</b></li><li>選「<b>安裝應用程式</b>」或「<b>加到主畫面</b>」</li><li>按「<b>安裝</b>」</li></ol><div class="note">完成後回到手機桌面，就會看到「英語冒險島」圖示 🏝️</div>');
  }
  /* ===== iPhone / iPad 安裝引導：大箭頭指向分享按鈕 ===== */
  const SHARE_SVG='<svg viewBox="0 0 24 24" width="26" height="26" style="vertical-align:-6px"><path d="M12 3v12M8 7l4-4 4 4" fill="none" stroke="#1E7CF2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 10H6a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1h-2" fill="none" stroke="#1E7CF2" stroke-width="2.2" stroke-linecap="round"/></svg>';
  function iosGuide(force){
    if(!force){try{if(localStorage.getItem('kidsEN_iosNoGuide')||sessionStorage.getItem('kidsEN_iosShown'))return;sessionStorage.setItem('kidsEN_iosShown','1')}catch(e){}}
    if(document.querySelector('.iosg'))return;
    const ver=+((ua.match(/Version\/(\d+)/)||[])[1]||0),iPad=/iPad/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    const mode=iPad?'ipad':ver>=26?'new':'old';
    const step1={old:`按畫面<b>最下面中間</b>的「<b>分享</b>」${SHARE_SVG}`,
      new:`按畫面<b>右下角</b>的「<b>⋯</b>」，再按「<b>分享</b>」${SHARE_SVG}`,
      ipad:`按畫面<b>右上角</b>的「<b>分享</b>」${SHARE_SVG}`}[mode];
    const g=document.createElement('div');g.className='iosg iosg-'+mode;
    g.innerHTML=`<div class="iosarrow"><span class="lbl">${mode=='new'?'「⋯」在這下面':'「分享」在這'+(mode=='ipad'?'上面':'下面')}</span><div>${mode=='ipad'?'👆':'👇'}</div></div>
     <div class="ioscard"><div class="iosh">📲 把冒險島裝到 ${iPad?'iPad':'iPhone'}<small>只要 3 步，裝好後沒網路也能玩</small></div>
      <ol class="iossteps">
       <li><span class="n">1</span><span>${step1}</span></li>
       <li><span class="n">2</span><span>往下滑，按「<b>加入主畫面</b>」<span class="ib">＋</span>${mode=='new'?'<br><small>沒看到的話，先按「更多」或往上滑選單</small>':''}</span></li>
       <li><span class="n">3</span><span>按右上角「<b>新增</b>」，桌面就會出現 🏝️ 圖示</span></li>
      </ol>
      <div class="iosfoot">${mode=='ipad'?'分享按鈕在網址列旁邊。':'看不到下方工具列？先在畫面上往下輕滑一下。'}</div>
      <div class="iosbtns"><button class="btn" id="iosok">知道了，我去按分享</button><button class="iosno" id="iosno">已經裝好了，不要再提醒</button></div></div>`;
    document.body.appendChild(g);document.body.classList.add('iosguide-on');
    const close=()=>{g.remove();document.body.classList.remove('iosguide-on')};
    g.querySelector('#iosok').onclick=close;
    g.querySelector('#iosno').onclick=()=>{try{localStorage.setItem('kidsEN_iosNoGuide','1')}catch(e){}close()};
  }
  /* iPhone 用 Safari 打開時，自動跳出一次引導 */
  if(isIOS&&!inLine&&!inFB&&!isIOSChrome)window.addEventListener('load',()=>setTimeout(()=>iosGuide(false),1200));
  window.addEventListener('load',()=>setTimeout(showBar,600));
})();
</script>
<script>
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
